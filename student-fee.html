<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Fees | Kumaun Institute</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#1f2937;
}

.header{
    background:#172554;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand h2{
    font-size:21px;
}

.brand p{
    margin-top:4px;
    font-size:12px;
    color:#cbd5e1;
}

.back-btn{
    background:white;
    color:#172554;
    border:0;
    padding:10px 16px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.main{
    max-width:1300px;
    margin:auto;
    padding:25px;
}

.top{
    margin-bottom:20px;
}

.top h1{
    font-size:28px;
    color:#172554;
}

.top p{
    margin-top:6px;
    color:#64748b;
    font-size:14px;
}

.message{
    display:none;
    padding:14px 16px;
    border-radius:10px;
    margin-bottom:18px;
    font-weight:600;
}

.error-message{
    background:#fee2e2;
    color:#991b1b;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.summary-card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.summary-card h3{
    color:#64748b;
    font-size:13px;
    margin-bottom:10px;
}

.summary-card strong{
    font-size:28px;
    color:#172554;
}

.paid-card strong{
    color:#16a34a;
}

.remaining-card strong{
    color:#dc2626;
}

.pending-card strong{
    color:#d97706;
}

.box{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.box-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.box-title h2{
    font-size:21px;
    color:#172554;
}

.table-scroll{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

th,
td{
    padding:14px 12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f8fafc;
    color:#475569;
    font-size:13px;
}

td{
    font-size:14px;
}

.status{
    display:inline-block;
    padding:7px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status-pending{
    background:#fef3c7;
    color:#92400e;
}

.status-approved{
    background:#dcfce7;
    color:#166534;
}

.status-rejected{
    background:#fee2e2;
    color:#991b1b;
}

.empty,
.loading{
    text-align:center;
    padding:35px;
    color:#64748b;
}

.refresh-btn{
    background:#172554;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

@media(max-width:900px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .header{
        padding:12px 15px;
    }

    .brand h2{
        font-size:16px;
    }

    .brand p{
        font-size:10px;
    }

    .back-btn{
        padding:8px 11px;
        font-size:12px;
    }

    .main{
        padding:15px;
    }

    .top h1{
        font-size:24px;
    }

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .summary-card{
        padding:16px;
    }

    .summary-card strong{
        font-size:22px;
    }

    .box{
        padding:12px;
    }

    .box-title h2{
        font-size:18px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="brand">

        <h2>Kumaun Institute</h2>

        <p>Student Fee Management</p>

    </div>

    <button
        class="back-btn"
        onclick="location.href='student-dashboard.html'"
    >
        ← Dashboard
    </button>

</header>


<main class="main">

    <div class="top">

        <h1>💰 My Fees</h1>

        <p>Apni fee aur payment history yahan dekhein.</p>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div class="summary-grid">

        <div class="summary-card">

            <h3>Total Course Fee</h3>

            <strong id="totalFee">
                ₹0
            </strong>

        </div>


        <div class="summary-card paid-card">

            <h3>Approved / Paid Fee</h3>

            <strong id="paidFee">
                ₹0
            </strong>

        </div>


        <div class="summary-card remaining-card">

            <h3>Remaining Fee</h3>

            <strong id="remainingFee">
                ₹0
            </strong>

        </div>


        <div class="summary-card pending-card">

            <h3>Pending Payment</h3>

            <strong id="pendingAmount">
                ₹0
            </strong>

        </div>

    </div>


    <div class="box">

        <div class="box-title">

            <h2>📋 Payment History</h2>

            <button
                class="refresh-btn"
                onclick="loadStudentFeeData()"
            >
                ↻ Refresh
            </button>

        </div>


        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>Amount</th>
                        <th>Transaction ID</th>
                        <th>Payment Date</th>
                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="paymentHistoryBody">

                    <tr>

                        <td
                            colspan="4"
                            class="loading"
                        >
                            Payment history load ho rahi hai...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://sfgnwdljakmtuyoxmltr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   GET LOGGED IN STUDENT
========================================= */

function getStudentId(){

    const studentId =
    localStorage.getItem(
        "studentId"
    );

    return studentId;

}


/* =========================================
   LOAD STUDENT FEE DATA
========================================= */

async function loadStudentFeeData(){

    const studentId =
    getStudentId();


    const body =
    document.getElementById(
        "paymentHistoryBody"
    );


    if(!studentId){

        body.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    ❌ Student login nahi mila. Please dobara login karein.
                </td>
            </tr>
        `;

        showMessage(
            "Student login nahi mila.",
            "error"
        );

        return;

    }


    body.innerHTML = `
        <tr>
            <td
                colspan="4"
                class="loading"
            >
                Payment history load ho rahi hai...
            </td>
        </tr>
    `;


    try{

        /* LOAD STUDENT */

        const {
            data:student,
            error:studentError
        } =
        await supabaseClient
        .from("Students")
        .select(
            "id,name,total_fee,paid_fee"
        )
        .eq(
            "id",
            studentId
        )
        .single();


        if(studentError){

            throw studentError;

        }


        const totalFee =
        Number(
            student.total_fee || 0
        );


        const paidFee =
        Number(
            student.paid_fee || 0
        );


        const remainingFee =
        Math.max(
            totalFee - paidFee,
            0
        );


        document.getElementById(
            "totalFee"
        ).textContent =
        formatMoney(totalFee);


        document.getElementById(
            "paidFee"
        ).textContent =
        formatMoney(paidFee);


        document.getElementById(
            "remainingFee"
        ).textContent =
        formatMoney(remainingFee);


        /* LOAD PAYMENT HISTORY */

        const {
            data:payments,
            error:paymentError
        } =
        await supabaseClient
        .from("fee_payments")
        .select("*")
        .eq(
            "student_id",
            studentId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(paymentError){

            throw paymentError;

        }


        const paymentData =
        payments || [];


        let pendingAmount = 0;


        paymentData.forEach(
        function(payment){

            if(
                String(
                    payment.status || "Pending"
                )
                .toLowerCase() ===
                "pending"
            ){

                pendingAmount +=
                Number(
                    payment.amount || 0
                );

            }

        });


        document.getElementById(
            "pendingAmount"
        ).textContent =
        formatMoney(
            pendingAmount
        );


        displayPaymentHistory(
            paymentData
        );

    }
    catch(error){

        console.error(error);

        body.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    ❌ ${escapeHTML(error.message)}
                </td>
            </tr>
        `;


        showMessage(
            "Fee details load nahi hui: " +
            error.message,
            "error"
        );

    }

}


/* =========================================
   DISPLAY PAYMENT HISTORY
========================================= */

function displayPaymentHistory(payments){

    const body =
    document.getElementById(
        "paymentHistoryBody"
    );


    body.innerHTML = "";


    if(!payments.length){

        body.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    Abhi aapki koi payment history nahi hai.
                </td>
            </tr>
        `;

        return;

    }


    payments.forEach(
    function(payment){

        const status =
        String(
            payment.status || "Pending"
        );


        const normalizedStatus =
        status.toLowerCase();


        let statusClass =
        "status-pending";


        if(
            normalizedStatus ===
            "approved"
        ){

            statusClass =
            "status-approved";

        }


        if(
            normalizedStatus ===
            "rejected"
        ){

            statusClass =
            "status-rejected";

        }


        const row =
        document.createElement(
            "tr"
        );


        row.innerHTML = `

            <td>
                <strong>
                    ${formatMoney(payment.amount)}
                </strong>
            </td>


            <td>
                ${escapeHTML(
                    payment.transaction_id || "-"
                )}
            </td>


            <td>
                ${formatDate(
                    payment.payment_date
                )}
            </td>


            <td>

                <span
                    class="status ${statusClass}"
                >
                    ${escapeHTML(status)}
                </span>

            </td>

        `;


        body.appendChild(
            row
        );

    });

}


/* =========================================
   FORMAT MONEY
========================================= */

function formatMoney(value){

    const amount =
    Number(value || 0);


    return "₹" +
    amount.toLocaleString(
        "en-IN"
    );

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(value){

    if(!value){

        return "-";

    }


    const date =
    new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return value;

    }


    return date.toLocaleDateString(
        "en-IN",
        {

            day:"2-digit",
            month:"2-digit",
            year:"numeric"

        }
    );

}


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    text,
    type
){

    const message =
    document.getElementById(
        "message"
    );


    message.className =
    "message";


    if(
        type === "error"
    ){

        message.classList.add(
            "error-message"
        );

    }


    message.textContent =
    text;


    message.style.display =
    "block";


    setTimeout(
    function(){

        message.style.display =
        "none";

    },
    5000
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadStudentFeeData();

</script>

</body>
</html>
