<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Student | Kumaun Institute</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#172554;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h2{
    font-size:20px;
}

.header p{
    font-size:12px;
    opacity:.8;
    margin-top:3px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.back-btn,
.logout-btn{
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.back-btn{
    background:white;
    color:#172554;
}

.logout-btn{
    background:#ef4444;
    color:white;
}

.main{
    max-width:1000px;
    margin:25px auto;
    padding:0 15px;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

h1{
    font-size:25px;
    margin-bottom:22px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#444;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d5d5d5;
    border-radius:8px;
    outline:none;
    font-size:14px;
    background:white;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

.photo-area{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
    padding-bottom:20px;
    border-bottom:1px solid #eee;
}

.photo-preview{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #e5e7eb;
}

.no-photo{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#e8efff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.save-btn{
    background:#2563eb;
    color:white;
    border:0;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.cancel-btn{
    background:#e5e7eb;
    color:#333;
    border:0;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
}

.message{
    display:none;
    margin-bottom:20px;
    padding:12px;
    border-radius:8px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

.student-id-box{
    background:#eff6ff;
    color:#1d4ed8;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
    font-weight:bold;
}

@media(max-width:650px){

    .header{
        padding:12px 15px;
    }

    .header h2{
        font-size:16px;
    }

    .header p{
        font-size:10px;
    }

    .header-buttons{
        gap:5px;
    }

    .back-btn,
    .logout-btn{
        padding:8px 9px;
        font-size:11px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .box{
        padding:18px;
    }

    .photo-area{
        align-items:flex-start;
    }

    .buttons{
        flex-direction:column;
    }

    .save-btn,
    .cancel-btn{
        width:100%;
    }
}

</style>

</head>

<body>


<header class="header">

    <div>

        <h2>Kumaun Institute</h2>

        <p>Edit Student Details</p>

    </div>

    <div class="header-buttons">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Profile
        </button>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="main">

<div class="box">

<h1>✏️ Edit Student</h1>

<div
    id="message"
    class="message"
></div>


<div
    id="studentIdBox"
    class="student-id-box"
    style="display:none;"
></div>


<div
    id="loading"
    class="loading"
>
    ⏳ Student details load ho rahe hain...
</div>


<form
    id="editForm"
    style="display:none;"
>


<!-- PHOTO -->

<div class="photo-area">

    <div id="photoContainer">

        <div class="no-photo">
            👤
        </div>

    </div>

    <div>

        <label>
            Student Photo
        </label>

        <input
            type="file"
            id="photo"
            accept="image/png,image/jpeg,image/jpg,image/webp"
        >

        <small>
            New photo choose karna optional hai.
        </small>

    </div>

</div>


<div class="form-grid">


<!-- NAME -->

<div class="field">

    <label>
        Name
    </label>

    <input
        type="text"
        id="name"
        required
    >

</div>


<!-- EMAIL -->

<div class="field">

    <label>
        Email
    </label>

    <input
        type="email"
        id="email"
    >

</div>


<!-- PHONE -->

<div class="field">

    <label>
        Phone
    </label>

    <input
        type="text"
        id="phone"
    >

</div>


<!-- COURSE -->

<div class="field">

    <label>
        Course
    </label>

    <input
        type="text"
        id="course"
    >

</div>


<!-- DOB -->

<div class="field">

    <label>
        Date of Birth
    </label>

    <input
        type="date"
        id="dob"
    >

</div>


<!-- ADMISSION DATE -->

<div class="field">

    <label>
        Admission Date
    </label>

    <input
        type="date"
        id="admission_date"
    >

</div>


<!-- TOTAL FEE -->

<div class="field">

    <label>
        Total Fee
    </label>

    <input
        type="number"
        id="total_fee"
        min="0"
    >

</div>


<!-- PAID FEE -->

<div class="field">

    <label>
        Paid Fee
    </label>

    <input
        type="number"
        id="paid_fee"
        min="0"
    >

</div>


<!-- STATUS -->

<div class="field">

    <label>
        Status
    </label>

    <select id="status">

        <option value="active">
            Active
        </option>

        <option value="pending">
            Pending
        </option>

        <option value="passout">
            Passout
        </option>

    </select>

</div>


<!-- ADDRESS -->

<div class="field full">

    <label>
        Address
    </label>

    <textarea
        id="address"
    ></textarea>

</div>


</div>


<div class="buttons">

    <button
        type="submit"
        class="save-btn"
        id="saveBtn"
    >
        💾 Save Changes
    </button>

    <button
        type="button"
        class="cancel-btn"
        onclick="goBack()"
    >
        Cancel
    </button>

</div>

</form>

</div>

</main>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://sfgnwdljakmtuyoxmltr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   BUCKET
========================================= */

const BUCKET_NAME =
    "student-photos";


/* =========================================
   GET STUDENT ID
========================================= */

function getStudentId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlId =
        params.get("id");

    if(urlId){

        const id =
            Number(urlId);

        if(
            Number.isInteger(id) &&
            id > 0
        ){

            return id;

        }

    }


    /* OLD METHOD FALLBACK */

    const localId =
        localStorage.getItem(
            "editStudentId"
        );

    if(localId){

        const id =
            Number(localId);

        if(
            Number.isInteger(id) &&
            id > 0
        ){

            return id;

        }

    }


    return null;

}


const studentId =
    getStudentId();


let oldPhotoUrl =
    null;


/* =========================================
   CHECK STUDENT ID
========================================= */

if(!studentId){

    document.getElementById(
        "loading"
    ).innerHTML = `

        ❌ Student ID nahi mili.

        <br><br>

        <button
            onclick="location.href='students.html'"
            style="
                padding:10px 15px;
                border:none;
                border-radius:8px;
                background:#2563eb;
                color:white;
                cursor:pointer;
            "
        >
            👨‍🎓 Students
        </button>

    `;

}
else{

    document.getElementById(
        "studentIdBox"
    ).style.display =
        "block";

    document.getElementById(
        "studentIdBox"
    ).textContent =
        "Student ID: " + studentId;

    loadStudent();

}


/* =========================================
   LOAD STUDENT
========================================= */

async function loadStudent(){

    try{

        console.log(
            "Loading student:",
            studentId
        );


        const {
            data,
            error
        } =
        await supabaseClient

            .from("Students")

            .select("*")

            .eq(
                "id",
                studentId
            )

            .maybeSingle();


        console.log(
            "Student data:",
            data
        );


        console.log(
            "Student error:",
            error
        );


        if(error){

            throw error;

        }


        if(!data){

            document.getElementById(
                "loading"
            ).innerHTML = `

                ❌ Student nahi mila.

                <br><br>

                Student ID:
                <strong>
                    ${studentId}
                </strong>

                <br><br>

                <button
                    onclick="location.href='students.html'"
                    style="
                        padding:10px 15px;
                        border:none;
                        border-radius:8px;
                        background:#2563eb;
                        color:white;
                        cursor:pointer;
                    "
                >
                    👨‍🎓 Students
                </button>

            `;

            return;

        }


        oldPhotoUrl =
            data.photo_url || null;


        /* NAME */

        document.getElementById(
            "name"
        ).value =
            data.name || "";


        /* EMAIL */

        document.getElementById(
            "email"
        ).value =
            data.email || "";


        /* PHONE */

        document.getElementById(
            "phone"
        ).value =
            data.phone || "";


        /* COURSE */

        document.getElementById(
            "course"
        ).value =
            data.course || "";


        /* DOB */

        document.getElementById(
            "dob"
        ).value =
            formatDateForInput(
                data.dob
            );


        /* ADMISSION */

        document.getElementById(
            "admission_date"
        ).value =
            formatDateForInput(
                data.admission_date
            );


        /* ADDRESS */

        document.getElementById(
            "address"
        ).value =
            data.address || "";


        /* TOTAL FEE */

        document.getElementById(
            "total_fee"
        ).value =
            data.total_fee ?? 0;


        /* PAID FEE */

        document.getElementById(
            "paid_fee"
        ).value =
            data.paid_fee ?? 0;


        /* STATUS */

        document.getElementById(
            "status"
        ).value =
            data.status || "active";


        /* PHOTO */

        if(data.photo_url){

            document.getElementById(
                "photoContainer"
            ).innerHTML = `

                <img
                    src="${escapeHTML(
                        data.photo_url
                    )}"
                    class="photo-preview"
                    alt="Student Photo"
                    onerror="this.style.display='none';"
                >

            `;

        }


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "editForm"
        ).style.display =
            "block";


    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        document.getElementById(
            "loading"
        ).innerHTML = `

            ❌ Student load nahi hua.

            <br><br>

            ${escapeHTML(
                error.message
            )}

        `;

    }

}


/* =========================================
   FORM SUBMIT
========================================= */

document
.getElementById("editForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const saveBtn =
            document.getElementById(
                "saveBtn"
            );


        try{

            saveBtn.disabled =
                true;

            saveBtn.textContent =
                "⏳ Saving...";


            showMessage(
                "Changes save ho rahe hain...",
                "loading"
            );


            /* =========================
               VALIDATION
            ========================= */

            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            if(!name){

                throw new Error(
                    "Student name required hai."
                );

            }


            const totalFee =
                Number(
                    document.getElementById(
                        "total_fee"
                    ).value
                ) || 0;


            const paidFee =
                Number(
                    document.getElementById(
                        "paid_fee"
                    ).value
                ) || 0;


            if(paidFee > totalFee){

                throw new Error(
                    "Paid Fee Total Fee se zyada nahi ho sakti."
                );

            }


            /* =========================
               PHOTO
            ========================= */

            const photoFile =
                document.getElementById(
                    "photo"
                ).files[0];


            let photoUrl =
                oldPhotoUrl;


            if(photoFile){

                if(
                    photoFile.size >
                    5 * 1024 * 1024
                ){

                    throw new Error(
                        "Photo 5 MB se chhoti honi chahiye."
                    );

                }


                const extension =
                    photoFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                const filePath =
                    studentId +
                    "/profile_" +
                    Date.now() +
                    "." +
                    extension;


                console.log(
                    "Uploading photo:",
                    filePath
                );


                const {
                    error:
                    photoUploadError
                } =
                await supabaseClient

                    .storage

                    .from(
                        BUCKET_NAME
                    )

                    .upload(
                        filePath,
                        photoFile,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                false,

                            contentType:
                                photoFile.type
                        }
                    );


                if(photoUploadError){

                    throw photoUploadError;

                }


                const {
                    data:
                    publicData
                } =
                supabaseClient

                    .storage

                    .from(
                        BUCKET_NAME
                    )

                    .getPublicUrl(
                        filePath
                    );


                photoUrl =
                    publicData.publicUrl;


                console.log(
                    "New photo URL:",
                    photoUrl
                );

            }


            /* =========================
               UPDATED DATA
            ========================= */

            const updatedStudent = {

                name:
                    name,

                email:
                    document.getElementById(
                        "email"
                    ).value.trim() || null,

                phone:
                    document.getElementById(
                        "phone"
                    ).value.trim() || null,

                course:
                    document.getElementById(
                        "course"
                    ).value.trim() || null,

                dob:
                    document.getElementById(
                        "dob"
                    ).value || null,

                address:
                    document.getElementById(
                        "address"
                    ).value.trim() || null,

                admission_date:
                    document.getElementById(
                        "admission_date"
                    ).value || null,

                total_fee:
                    totalFee,

                paid_fee:
                    paidFee,

                status:
                    document.getElementById(
                        "status"
                    ).value,

                photo_url:
                    photoUrl

            };


            console.log(
                "Updating student:",
                updatedStudent
            );


            /* =========================
               UPDATE DATABASE
            ========================= */

            const {
                data,
                error
            } =
            await supabaseClient

                .from("Students")

                .update(
                    updatedStudent
                )

                .eq(
                    "id",
                    studentId
                )

                .select();


            console.log(
                "Updated:",
                data
            );


            console.log(
                "Update error:",
                error
            );


            if(error){

                throw error;

            }


            if(!data || data.length === 0){

                throw new Error(
                    "Student update nahi hua. Supabase RLS policy check karein."
                );

            }


            showMessage(
                "✅ Student details successfully updated!",
                "success"
            );


            /* Remove old localStorage */

            localStorage.removeItem(
                "editStudentId"
            );


            /* Go back to profile */

            setTimeout(
                function(){

                    window.location.href =
                        "student-profile.html?id=" +
                        encodeURIComponent(
                            studentId
                        );

                },
                1000
            );


        }
        catch(error){

            console.error(
                "UPDATE ERROR:",
                error
            );


            showMessage(
                "❌ Update nahi hua: " +
                error.message,
                "error"
            );

        }
        finally{

            saveBtn.disabled =
                false;

            saveBtn.textContent =
                "💾 Save Changes";

        }

    }
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    if(type === "success"){

        message.style.background =
            "#dcfce7";

        message.style.color =
            "#166534";

    }
    else if(type === "error"){

        message.style.background =
            "#fee2e2";

        message.style.color =
            "#991b1b";

    }
    else{

        message.style.background =
            "#fff7ed";

        message.style.color =
            "#9a3412";

    }


    message.textContent =
        text;

}


/* =========================================
   DATE FORMAT
========================================= */

function formatDateForInput(
    value
){

    if(!value){

        return "";

    }


    return String(
        value
    ).substring(
        0,
        10
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   BACK
========================================= */

function goBack(){

    window.location.href =
        "student-profile.html?id=" +
        encodeURIComponent(
            studentId
        );

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
