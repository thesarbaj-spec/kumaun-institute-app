<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Student Login | Kumaun Institute of Computer Education
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#172033;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.logo{
    width:90px;
    height:90px;
    margin:0 auto 15px;
    border-radius:50%;
    overflow:hidden;
    background:#172554;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    text-align:center;
    font-size:18px;
    line-height:1.3;
    color:#172554;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:13px;
    margin-top:7px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#475569;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#2563eb;
}

.login-btn{
    width:100%;
    border:0;
    background:#172554;
    color:white;
    padding:13px;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#1e3a8a;
}

.login-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.forgot-btn{
    width:100%;
    border:0;
    background:none;
    color:#2563eb;
    padding:12px 0 0;
    font-size:13px;
    cursor:pointer;
}

.forgot-btn:hover{
    text-decoration:underline;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
    line-height:1.4;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.reset-box{
    display:none;
}

.back-btn{
    width:100%;
    border:0;
    background:#e2e8f0;
    color:#334155;
    padding:13px;
    border-radius:9px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.portal-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:24px 0 15px;
    color:#94a3b8;
    font-size:12px;
}

.portal-divider::before,
.portal-divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e2e8f0;
}

.portal-title{
    text-align:center;
    color:#64748b;
    font-size:12px;
    margin-bottom:12px;
}

.portal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.portal-btn{
    border:1px solid #dbe1ea;
    background:#f8fafc;
    color:#334155;
    padding:12px 8px;
    border-radius:9px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.portal-btn:hover{
    background:#eef2ff;
    border-color:#94a3b8;
    transform:translateY(-1px);
}

.footer{
    text-align:center;
    color:#94a3b8;
    font-size:11px;
    margin-top:20px;
}

.small-note{
    text-align:center;
    color:#64748b;
    font-size:12px;
    line-height:1.5;
    margin-bottom:20px;
}

.loading-screen{
    display:none;
    position:fixed;
    inset:0;
    background:#f4f6f9;
    z-index:9999;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    color:#172554;
}

.loading-screen.show{
    display:flex;
}

.loader{
    width:38px;
    height:38px;
    border:4px solid #cbd5e1;
    border-top-color:#172554;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

</style>

</head>

<script>


/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
    "https://sfgnwdljakmtuyoxmltr.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );



/* =========================================
   PAGE NAMES
========================================= */

const OWNER_LOGIN_PAGE =
    "login.html";


const TEACHER_LOGIN_PAGE =
    "teacher-login.html";


const STUDENT_DASHBOARD_PAGE =
    "student-dashboard.html";



/* =========================================
   ELEMENTS
========================================= */

const loadingScreen =
    document.getElementById("loadingScreen");


const loadingText =
    document.getElementById("loadingText");


const loginSection =
    document.getElementById("loginSection");


const resetSection =
    document.getElementById("resetSection");


const loginForm =
    document.getElementById("loginForm");


const mobileInput =
    document.getElementById("mobile");


const passwordInput =
    document.getElementById("password");


const loginBtn =
    document.getElementById("loginBtn");


const forgotBtn =
    document.getElementById("forgotBtn");


const loginMessage =
    document.getElementById("loginMessage");


const resetForm =
    document.getElementById("resetForm");


const resetMobile =
    document.getElementById("resetMobile");


const dob =
    document.getElementById("dob");


const joiningDate =
    document.getElementById("joiningDate");


const newPassword =
    document.getElementById("newPassword");


const confirmPassword =
    document.getElementById("confirmPassword");


const resetBtn =
    document.getElementById("resetBtn");


const resetMessage =
    document.getElementById("resetMessage");


const backBtn =
    document.getElementById("backBtn");


const ownerLoginBtn =
    document.getElementById("ownerLoginBtn");


const teacherLoginBtn =
    document.getElementById("teacherLoginBtn");



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "message " + type;

    element.style.display =
        "block";

}



/* =========================================
   HIDE MESSAGE
========================================= */

function hideMessage(element){

    element.style.display =
        "none";

}



/* =========================================
   SHOW LOADING
========================================= */

function showLoading(text){

    if(text){

        loadingText.textContent =
            text;

    }

    loadingScreen.classList.add(
        "show"
    );

}



/* =========================================
   HIDE LOADING
========================================= */

function hideLoading(){

    loadingScreen.classList.remove(
        "show"
    );

}



/* =========================================
   CLEAR STUDENT LOCAL DATA
========================================= */

function clearStudentLocalData(){

    localStorage.removeItem(
        "studentId"
    );

    localStorage.removeItem(
        "student_id"
    );

    localStorage.removeItem(
        "loggedInStudentId"
    );

    localStorage.removeItem(
        "studentAuthUserId"
    );

    localStorage.removeItem(
        "studentLoggedIn"
    );

}



/* =========================================
   CLEAR OLD OWNER / TEACHER DATA
========================================= */

function clearOldPortalData(){

    /*
     * IMPORTANT:
     *
     * Student Login page par Owner/Teacher
     * ka old localStorage data ignore karna hai.
     */

    localStorage.removeItem(
        "loggedInPortal"
    );

    localStorage.removeItem(
        "ownerLoggedIn"
    );

    localStorage.removeItem(
        "teacherLoggedIn"
    );

    localStorage.removeItem(
        "ownerAuthUserId"
    );

    localStorage.removeItem(
        "teacherAuthUserId"
    );

}



/* =========================================
   CLEAR ALL STUDENT DATA
========================================= */

function clearAllStudentData(){

    clearStudentLocalData();

    localStorage.removeItem(
        "loggedInPortal"
    );

}



/* =========================================
   SAVE STUDENT LOGIN DATA
========================================= */

function saveStudentLoginData(
    studentId,
    authUserId
){

    localStorage.setItem(
        "studentId",
        String(studentId)
    );


    localStorage.setItem(
        "student_id",
        String(studentId)
    );


    localStorage.setItem(
        "loggedInStudentId",
        String(studentId)
    );


    localStorage.setItem(
        "studentAuthUserId",
        String(authUserId)
    );


    localStorage.setItem(
        "studentLoggedIn",
        "true"
    );


    /*
     * Student ke liye hi portal set hoga.
     */

    localStorage.setItem(
        "loggedInPortal",
        "student"
    );

}



/* =========================================
   STUDENT DASHBOARD REDIRECT
========================================= */

function redirectToStudentDashboard(){

    window.location.replace(
        STUDENT_DASHBOARD_PAGE
    );

}



/* =========================================
   OWNER LOGIN BUTTON
========================================= */

ownerLoginBtn.addEventListener(
    "click",
    function(){

        /*
         * Student session ko disturb nahi karna.
         * Sirf Owner Login page open karna hai.
         */

        showLoading(
            "Opening Owner Login..."
        );


        setTimeout(
            function(){

                window.location.href =
                    OWNER_LOGIN_PAGE;

            },
            250
        );

    }
);



/* =========================================
   TEACHER LOGIN BUTTON
========================================= */

teacherLoginBtn.addEventListener(
    "click",
    function(){

        /*
         * Student session ko disturb nahi karna.
         * Sirf Teacher Login page open karna hai.
         */

        showLoading(
            "Opening Teacher Login..."
        );


        setTimeout(
            function(){

                window.location.href =
                    TEACHER_LOGIN_PAGE;

            },
            250
        );

    }
);



/* =========================================
   AUTO LOGIN CHECK
========================================= */

async function checkExistingLogin(){

    showLoading(
        "Checking student login..."
    );


    try{

        /*
         * IMPORTANT FIX
         *
         * Yahan Owner/Teacher ka
         * loggedInPortal check NAHI hoga.
         *
         * Isliye:
         *
         * loggedInPortal = teacher
         *
         * hone ke baad bhi Teacher Dashboard
         * automatic open nahi hoga.
         */

        clearOldPortalData();


        /*
         * SUPABASE SESSION CHECK
         */

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if(error){

            console.error(
                "Session check error:",
                error
            );

            clearStudentLocalData();

            hideLoading();

            return;

        }


        const session =
            data &&
            data.session
                ? data.session
                : null;


        /*
         * SESSION NAHI HAI
         *
         * Normal Student Login page show hoga.
         */

        if(
            !session ||
            !session.user
        ){

            clearStudentLocalData();

            hideLoading();

            return;

        }


        /*
         * CURRENT SUPABASE USER
         */

        const authUserId =
            session.user.id;


        /*
         * STUDENTS TABLE ME CHECK
         */

        const {
            data: studentData,
            error: studentError
        } =
        await supabaseClient
            .from("Students")
            .select(
                "id, auth_user_id"
            )
            .eq(
                "auth_user_id",
                authUserId
            )
            .maybeSingle();


        if(studentError){

            console.error(
                "Student profile check error:",
                studentError
            );

            clearStudentLocalData();

            hideLoading();

            return;

        }


        /*
         * STUDENT PROFILE MIL GAYI
         */

        if(studentData){

            saveStudentLoginData(
                studentData.id,
                authUserId
            );


            redirectToStudentDashboard();

            return;

        }


        /*
         * SUPABASE SESSION ACTIVE HAI
         * LEKIN STUDENT PROFILE NAHI HAI.
         *
         * Isliye kisi bhi dashboard par
         * redirect nahi karna hai.
         */

        clearStudentLocalData();

        hideLoading();

    }
    catch(error){

        console.error(
            "Auto login error:",
            error
        );

        clearStudentLocalData();

        hideLoading();

    }

}



/* =========================================
   FORGOT PASSWORD
========================================= */

forgotBtn.addEventListener(
    "click",
    function(){

        hideMessage(
            loginMessage
        );


        loginSection.style.display =
            "none";


        resetSection.style.display =
            "block";

    }
);



/* =========================================
   BACK TO LOGIN
========================================= */

backBtn.addEventListener(
    "click",
    function(){

        hideMessage(
            resetMessage
        );


        resetSection.style.display =
            "none";


        loginSection.style.display =
            "block";

    }
);



/* =========================================
   STUDENT LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessage(
            loginMessage
        );


        const mobile =
            mobileInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !/^[0-9]{10}$/.test(
                mobile
            )
        ){

            showMessage(
                loginMessage,
                "Please enter a valid 10 digit mobile number.",
                "error"
            );

            return;

        }


        if(!password){

            showMessage(
                loginMessage,
                "Please enter your password.",
                "error"
            );

            return;

        }


        loginBtn.disabled =
            true;


        loginBtn.textContent =
            "Logging in...";


        try{

            /*
             * STUDENT AUTH EMAIL
             */

            const authEmail =
                mobile +
                "@students.kumauninstitute.local";


            /*
             * LOGIN
             */

            const {
                data: authData,
                error: authError
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:authEmail,
                    password:password

                });


            if(authError){

                console.error(
                    "Student login error:",
                    authError
                );


                showMessage(
                    loginMessage,
                    "Mobile number or password is incorrect.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Student Login";


                return;

            }


            if(
                !authData ||
                !authData.user
            ){

                showMessage(
                    loginMessage,
                    "Login nahi ho paya. Please try again.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Student Login";


                return;

            }


            /*
             * AUTH USER ID
             */

            const authUserId =
                authData.user.id;


            /*
             * STUDENT PROFILE CHECK
             */

            const {
                data: studentData,
                error: studentError
            } =
            await supabaseClient
                .from("Students")
                .select("*")
                .eq(
                    "auth_user_id",
                    authUserId
                )
                .maybeSingle();


            if(studentError){

                console.error(
                    "Student profile error:",
                    studentError
                );


                await supabaseClient
                    .auth
                    .signOut();


                clearAllStudentData();


                showMessage(
                    loginMessage,
                    "Student profile nahi mili.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Student Login";


                return;

            }


            if(!studentData){

                await supabaseClient
                    .auth
                    .signOut();


                clearAllStudentData();


                showMessage(
                    loginMessage,
                    "Student profile linked nahi hai.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Student Login";


                return;

            }


            /*
             * SAVE STUDENT DATA
             */

            saveStudentLoginData(
                studentData.id,
                authUserId
            );


            /*
             * SUCCESS
             */

            showMessage(
                loginMessage,
                "Login successful. Dashboard Open...",
                "success"
            );


            setTimeout(
                function(){

                    redirectToStudentDashboard();

                },
                700
            );

        }
        catch(error){

            console.error(
                "Student login exception:",
                error
            );


            showMessage(
                loginMessage,
                "Server error. Please try again.",
                "error"
            );


            loginBtn.disabled =
                false;


            loginBtn.textContent =
                "Student Login";

        }

    }
);



/* =========================================
   PASSWORD RESET
========================================= */

resetForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessage(
            resetMessage
        );


        const mobile =
            resetMobile.value.trim();


        const dateOfBirth =
            dob.value;


        const admissionDate =
            joiningDate.value;


        const password =
            newPassword.value;


        const confirm =
            confirmPassword.value;


        if(
            !/^[0-9]{10}$/.test(
                mobile
            )
        ){

            showMessage(
                resetMessage,
                "Please enter a valid 10 digit mobile number.",
                "error"
            );

            return;

        }


        if(!dateOfBirth){

            showMessage(
                resetMessage,
                "Please select your Date of Birth.",
                "error"
            );

            return;

        }


        if(!admissionDate){

            showMessage(
                resetMessage,
                "Please select your institute joining date.",
                "error"
            );

            return;

        }


        if(
            password.length < 6
        ){

            showMessage(
                resetMessage,
                "New password kam se kam 6 characters ka hona chahiye.",
                "error"
            );

            return;

        }


        if(
            password !== confirm
        ){

            showMessage(
                resetMessage,
                "New password aur confirm password same nahi hain.",
                "error"
            );

            return;

        }


        resetBtn.disabled =
            true;


        resetBtn.textContent =
            "Verifying...";


        try{

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/functions/v1/create-student-account",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "apikey":
                                SUPABASE_KEY

                        },

                        body:
                            JSON.stringify({

                                action:"reset",

                                mobile:mobile,

                                dob:dateOfBirth,

                                admission_date:
                                    admissionDate,

                                new_password:
                                    password

                            })

                    }

                );


            let result =
                null;


            try{

                result =
                    await response.json();

            }
            catch(jsonError){

                throw new Error(
                    "Server response invalid hai."
                );

            }


            if(
                !response.ok ||
                !result.success
            ){

                showMessage(
                    resetMessage,
                    result.message ||
                    "Student details match nahi hui.",
                    "error"
                );


                resetBtn.disabled =
                    false;


                resetBtn.textContent =
                    "Reset Password";


                return;

            }


            showMessage(
                resetMessage,
                "✅ Password successfully reset ho gaya. Ab naye password se login karein.",
                "success"
            );


            resetForm.reset();


            setTimeout(
                function(){

                    resetSection.style.display =
                        "none";


                    loginSection.style.display =
                        "block";


                    hideMessage(
                        resetMessage
                    );


                    resetBtn.disabled =
                        false;


                    resetBtn.textContent =
                        "Reset Password";

                },
                2000
            );

        }
        catch(error){

            console.error(
                "Password reset error:",
                error
            );


            showMessage(
                resetMessage,
                "Server error. Please try again.",
                "error"
            );


            resetBtn.disabled =
                false;


            resetBtn.textContent =
                "Reset Password";

        }

    }
);



/* =========================================
   AUTH STATE LISTENER
========================================= */

supabaseClient
.auth
.onAuthStateChange(
    function(event,session){

        /*
         * IMPORTANT:
         *
         * SIGNED_OUT par sirf student ka data
         * clear hoga.
         *
         * Owner/Teacher ka login is page se
         * control nahi hoga.
         */

        if(
            event === "SIGNED_OUT"
        ){

            clearStudentLocalData();

            localStorage.removeItem(
                "loggedInPortal"
            );

        }

    }
);



/* =========================================
   START
========================================= */

checkExistingLogin();
