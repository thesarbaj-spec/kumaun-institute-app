<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Settings | Kumaun Institute of Computer Education</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  color:#172554;
}

.header{
  background:#172554;
  color:white;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:3px;
}

.brand h1{
  font-size:19px;
}

.brand p{
  font-size:12px;
  opacity:.8;
  margin-top:3px;
}

.logout-btn{
  border:none;
  background:#ef4444;
  color:white;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  display:flex;
  min-height:calc(100vh - 76px);
}

.sidebar{
  width:235px;
  background:white;
  border-right:1px solid #ddd;
  padding:20px 12px;
}

.menu-btn{
  width:100%;
  border:none;
  background:transparent;
  padding:12px 14px;
  text-align:left;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:5px;
  font-size:14px;
  color:#172554;
}

.menu-btn:hover,
.menu-btn.active{
  background:#e8efff;
  color:#1d4ed8;
  font-weight:bold;
}

.main{
  flex:1;
  padding:25px;
  min-width:0;
}

.page-title{
  margin-bottom:22px;
}

.page-title h2{
  font-size:26px;
  margin-bottom:6px;
}

.page-title p{
  color:#64748b;
  font-size:14px;
}

.loading-box{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
  color:#64748b;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
  max-width:1000px;
}

.settings-card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  border:1px solid #e2e8f0;
}

.card-icon{
  width:52px;
  height:52px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  background:#eef4ff;
  margin-bottom:15px;
}

.settings-card h3{
  font-size:19px;
  margin-bottom:8px;
}

.card-description{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
  color:#334155;
}

.form-group input{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  outline:none;
  font-size:14px;
}

.form-group input:focus{
  border-color:#2563eb;
}

.date-select-row{
  display:grid;
  grid-template-columns:1fr 1.5fr 1.2fr;
  gap:8px;
}

.date-select-row select{
  width:100%;
  padding:12px 8px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  outline:none;
  font-size:13px;
  background:white;
  color:#172554;
  cursor:pointer;
}

.date-select-row select:focus{
  border-color:#2563eb;
}

.primary-btn{
  width:100%;
  border:none;
  background:#172554;
  color:white;
  padding:13px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.primary-btn:hover{
  background:#1e3a8a;
}

.reset-btn{
  width:100%;
  border:none;
  background:#2563eb;
  color:white;
  padding:13px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.reset-btn:hover{
  background:#1d4ed8;
}

.status{
  display:none;
  margin-top:15px;
  padding:11px;
  border-radius:8px;
  font-size:13px;
  line-height:1.5;
}

.status.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

@media(max-width:850px){

  .container{
    display:block;
  }

  .sidebar{
    width:100%;
    display:flex;
    overflow-x:auto;
    padding:9px;
    border-right:none;
    border-bottom:1px solid #ddd;
  }

  .menu-btn{
    min-width:125px;
    margin-right:5px;
    margin-bottom:0;
  }

  .main{
    padding:15px;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .header{
    padding:10px 12px;
  }

  .brand img{
    width:40px;
    height:40px;
  }

  .brand h1{
    font-size:14px;
  }

  .brand p{
    font-size:9px;
  }

  .logout-btn{
    padding:8px 10px;
    font-size:11px;
  }

  .page-title h2{
    font-size:22px;
  }

  .settings-card{
    padding:20px;
  }

  .date-select-row{
    grid-template-columns:1fr 1.4fr 1.1fr;
    gap:6px;
  }

  .date-select-row select{
    font-size:12px;
    padding:11px 5px;
  }

}

</style>

</head>

<body>

<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
  "https://sfgnwdljakmtuyoxmltr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let loggedInTeacherEmail = "";


/* =========================================
   SHOW STATUS
========================================= */

function showStatus(
  elementId,
  message,
  type
){

  const element =
    document.getElementById(
      elementId
    );

  element.textContent =
    message;

  element.className =
    "status " + type;

}


/* =========================================
   MONTHS
========================================= */

const monthNames = [
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"
];


/* =========================================
   CREATE DAY DROPDOWN
========================================= */

function fillDays(selectId){

  const select =
    document.getElementById(
      selectId
    );

  for(
    let day = 1;
    day <= 31;
    day++
  ){

    const option =
      document.createElement(
        "option"
      );

    option.value =
      String(day).padStart(
        2,
        "0"
      );

    option.textContent =
      day;

    select.appendChild(
      option
    );

  }

}


/* =========================================
   CREATE MONTH DROPDOWN
========================================= */

function fillMonths(selectId){

  const select =
    document.getElementById(
      selectId
    );

  monthNames.forEach(
    function(month,index){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(index + 1).padStart(
          2,
          "0"
        );

      option.textContent =
        month;

      select.appendChild(
        option
      );

    }
  );

}


/* =========================================
   CREATE YEAR DROPDOWN
   AUTOMATIC FUTURE YEARS
========================================= */

function fillYears(
  selectId,
  startYear,
  endYear
){

  const select =
    document.getElementById(
      selectId
    );

  for(
    let year = endYear;
    year >= startYear;
    year--
  ){

    const option =
      document.createElement(
        "option"
      );

    option.value =
      year;

    option.textContent =
      year;

    select.appendChild(
      option
    );

  }

}


/* =========================================
   INITIALIZE DATE DROPDOWNS
========================================= */

function initializeDateDropdowns(){

  const currentYear =
    new Date().getFullYear();


  /*
    DOB:
    Current year tak + purane years.
    Future DOB year nahi dikhega.
  */

  fillDays(
    "resetDobDay"
  );

  fillMonths(
    "resetDobMonth"
  );

  fillYears(
    "resetDobYear",
    1950,
    currentYear
  );


  /*
    JOINING DATE:
    Current year tak.
    Agar next year aata hai,
    automatically dropdown mein aa jayega.
  */

  fillDays(
    "resetJoiningDay"
  );

  fillMonths(
    "resetJoiningMonth"
  );

  fillYears(
    "resetJoiningYear",
    2000,
    currentYear
  );

}


/* =========================================
   GET DATE FROM DROPDOWNS
   YYYY-MM-DD
========================================= */

function getDateFromDropdowns(
  dayId,
  monthId,
  yearId
){

  const day =
    document.getElementById(
      dayId
    ).value;

  const month =
    document.getElementById(
      monthId
    ).value;

  const year =
    document.getElementById(
      yearId
    ).value;


  if(
    !day ||
    !month ||
    !year
  ){

    return "";

  }


  const date =
    new Date(
      Number(year),
      Number(month) - 1,
      Number(day)
    );


  /*
    Invalid date check
    Example:
    31 February
  */

  if(
    date.getFullYear() !== Number(year) ||
    date.getMonth() !== Number(month) - 1 ||
    date.getDate() !== Number(day)
  ){

    return "";

  }


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================================
   LOAD LOGGED-IN TEACHER
========================================= */

async function loadTeacherAccount(){

  const loadingBox =
    document.getElementById(
      "loadingBox"
    );

  const settingsContent =
    document.getElementById(
      "settingsContent"
    );


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .getSession();


    if(error){

      throw error;

    }


    if(
      !data ||
      !data.session ||
      !data.session.user
    ){

      loadingBox.textContent =
        "❌ Teacher login session not found. ";

      setTimeout(
        function(){

          window.location.href =
            "teacher-login.html";

        },
        1200
      );

      return;

    }


    const user =
      data.session.user;


    loggedInTeacherEmail =
      String(
        user.email || ""
      )
      .trim()
      .toLowerCase();


    if(!loggedInTeacherEmail){

      throw new Error(
        "Teacher email not found."
      );

    }


    document
      .getElementById(
        "changeEmail"
      )
      .value =
      loggedInTeacherEmail;


    document
      .getElementById(
        "resetEmail"
      )
      .value =
      loggedInTeacherEmail;


    loadingBox.style.display =
      "none";


    settingsContent.style.display =
      "grid";


  }
  catch(error){

    console.error(
      "Teacher settings load error:",
      error
    );


    loadingBox.textContent =
      "❌ Settings not loading: " +
      error.message;

  }

}


/* =========================================
   CHANGE PASSWORD
========================================= */

async function changePassword(){

  const currentPassword =
    document
      .getElementById(
        "currentPassword"
      )
      .value;


  const newPassword =
    document
      .getElementById(
        "changeNewPassword"
      )
      .value;


  const confirmPassword =
    document
      .getElementById(
        "changeConfirmPassword"
      )
      .value;


  const button =
    document
      .getElementById(
        "changePasswordButton"
      );


  if(
    !currentPassword ||
    !newPassword ||
    !confirmPassword
  ){

    showStatus(
      "changeStatus",
      "❌ Fill in all password fields.",
      "error"
    );

    return;

  }


  if(
    newPassword.length < 6
  ){

    showStatus(
      "changeStatus",
      "❌ New password must be at least 6 characters long.",
      "error"
    );

    return;

  }


  if(
    newPassword !==
    confirmPassword
  ){

    showStatus(
      "changeStatus",
      "❌ New Password and Confirm Password do not match.",
      "error"
    );

    return;

  }


  if(
    currentPassword ===
    newPassword
  ){

    showStatus(
      "changeStatus",
      "❌ The new password must be different from the current password.",
      "error"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Verifying...";


  try{

    showStatus(
      "changeStatus",
      "Current password verifying...",
      "info"
    );


    const {
      error: loginError
    } =
    await supabaseClient
      .auth
      .signInWithPassword({

        email:
          loggedInTeacherEmail,

        password:
          currentPassword

      });


    if(loginError){

      throw new Error(
        "Current password is incorrect."
      );

    }


    showStatus(
      "changeStatus",
      "Password updating...",
      "info"
    );


    const {
      error: updateError
    } =
    await supabaseClient
      .auth
      .updateUser({

        password:
          newPassword

      });


    if(updateError){

      throw updateError;

    }


    showStatus(
      "changeStatus",
      "✅ Password successfully changed.",
      "success"
    );


    document
      .getElementById(
        "currentPassword"
      )
      .value =
      "";


    document
      .getElementById(
        "changeNewPassword"
      )
      .value =
      "";


    document
      .getElementById(
        "changeConfirmPassword"
      )
      .value =
      "";


  }
  catch(error){

    console.error(
      "Change password error:",
      error
    );


    showStatus(
      "changeStatus",
      "❌ Password change failed: " +
      error.message,
      "error"
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "🔒 Change Password";

  }

}


/* =========================================
   RESET PASSWORD
========================================= */

async function resetPassword(){

  const email =
    loggedInTeacherEmail;


  const dob =
    getDateFromDropdowns(
      "resetDobDay",
      "resetDobMonth",
      "resetDobYear"
    );


  const joiningDate =
    getDateFromDropdowns(
      "resetJoiningDay",
      "resetJoiningMonth",
      "resetJoiningYear"
    );


  const newPassword =
    document
      .getElementById(
        "resetNewPassword"
      )
      .value;


  const confirmPassword =
    document
      .getElementById(
        "resetConfirmPassword"
      )
      .value;


  const button =
    document
      .getElementById(
        "resetPasswordButton"
      );


  if(
    !email ||
    !dob ||
    !joiningDate ||
    !newPassword ||
    !confirmPassword
  ){

    showStatus(
      "resetStatus",
      "❌ Fill in all required fields.",
      "error"
    );

    return;

  }


  /*
    DOB future check
  */

  const today =
    new Date();

  today.setHours(
    0,
    0,
    0,
    0
  );


  const dobDate =
    new Date(
      dob + "T00:00:00"
    );


  if(
    dobDate > today
  ){

    showStatus(
      "resetStatus",
      "❌ Date of Birth cannot be in the future.",
      "error"
    );

    return;

  }


  /*
    Joining date future check
  */

  const joiningDateObject =
    new Date(
      joiningDate + "T00:00:00"
    );


  if(
    joiningDateObject > today
  ){

    showStatus(
      "resetStatus",
      "❌ Joining Date cannot be in the future.",
      "error"
    );

    return;

  }


  /*
    Joining Date DOB se pehle nahi honi chahiye
  */

  if(
    joiningDateObject < dobDate
  ){

    showStatus(
      "resetStatus",
      "❌ Joining Date cannot be before Date of Birth.",
      "error"
    );

    return;

  }


  if(
    newPassword.length < 6
  ){

    showStatus(
      "resetStatus",
      "❌ Password must be at least 6 characters long.",
      "error"
    );

    return;

  }


  if(
    newPassword !==
    confirmPassword
  ){

    showStatus(
      "resetStatus",
      "❌ New Password and Confirm Password do not match.",
      "error"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Verifying...";


  try{

    showStatus(
      "resetStatus",
      "Teacher details verifying...",
      "info"
    );


    const {
      data: teacher,
      error: teacherError
    } =
    await supabaseClient
      .from("teachers")
      .select(
        "id,name,email,dob,joining_date"
      )
      .eq(
        "email",
        email
      )
      .eq(
        "dob",
        dob
      )
      .eq(
        "joining_date",
        joiningDate
      )
      .maybeSingle();


    if(teacherError){

      throw teacherError;

    }


    if(!teacher){

      showStatus(
        "resetStatus",
        "❌ Email, DOB or Joining Date do not match.",
        "error"
      );

      return;

    }


    showStatus(
      "resetStatus",
      "Teacher verified. Password reset is in progress...",
      "info"
    );


    const {
      data,
      error
    } =
    await supabaseClient
      .functions
      .invoke(
        "reset-teacher-password",
        {

          body:{
            email:
              email,

            newPassword:
              newPassword
          }

        }
      );


    if(error){

      throw error;

    }


    if(
      data &&
      data.success === false
    ){

      throw new Error(
        data.error ||
        "Password reset failed."
      );

    }


    showStatus(
      "resetStatus",
      "✅ Password successfully reset.",
      "success"
    );


    document
      .getElementById(
        "resetDobDay"
      )
      .value =
      "";

    document
      .getElementById(
        "resetDobMonth"
      )
      .value =
      "";

    document
      .getElementById(
        "resetDobYear"
      )
      .value =
      "";


    document
      .getElementById(
        "resetJoiningDay"
      )
      .value =
      "";

    document
      .getElementById(
        "resetJoiningMonth"
      )
      .value =
      "";

    document
      .getElementById(
        "resetJoiningYear"
      )
      .value =
      "";


    document
      .getElementById(
        "resetNewPassword"
      )
      .value =
      "";


    document
      .getElementById(
        "resetConfirmPassword"
      )
      .value =
      "";


  }
  catch(error){

    console.error(
      "Reset password error:",
      error
    );


    showStatus(
      "resetStatus",
      "❌ Password reset failed: " +
      error.message,
      "error"
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "🔑 Reset Password";

  }

}

========================================= */

async function logout(){

  try{

    await supabaseClient
      .auth
      .signOut();

  }
  catch(error){

    console.error(
      "Logout error:",
      error
    );

  }


  localStorage.removeItem(
    "teacher_email"
  );

  localStorage.removeItem(
    "teacherEmail"
  );

  localStorage.removeItem(
    "teacher_name"
  );

  localStorage.removeItem(
    "teacher_id"
  );

  sessionStorage.clear();


  window.location.href =
    "teacher-login.html";

}
