<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Login - Institute Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071b35, #1268ed);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 14px;
      border-radius: 50%;
      overflow: hidden;
      background: #eaf2ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      color: #071b35;
      font-size: 18px;
      margin-bottom: 3px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #344054;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1268ed;
      box-shadow: 0 0 0 3px #1268ed18;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 50px;
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 9px;
      background: #1268ed;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 7px;
      text-align: center;
      font-size: 14px;
    }

    .security {
      text-align: center;
      color: #667085;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <img src="kumaun institute logo.png" alt="Institute Logo">
    </div>

    <h1>Kumaun Institute of Computer Education</h1>

    <p class="subtitle">
      Institute Management System
    </p>

    <form id="loginForm">

      <div class="input-group">

        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter email"
          required
        >

      </div>

      <div class="input-group">

        <label for="password">Password</label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >👁</button>

        </div>

      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Login to Dashboard
      </button>

      <div class="message" id="message"></div>

    </form>

    <p class="security">
      🔒 Secure Owner Access
    </p>

  </div>


  <script>

    /* =================================
       SUPABASE CONFIGURATION
    ================================= */

    const SUPABASE_URL =
      "https://sfgnwdljakmtuyoxmltr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";


    const { createClient } = supabase;


    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* =================================
       ALREADY LOGGED-IN CHECK
    ================================= */

    document.addEventListener("DOMContentLoaded", function () {

      const isLoggedIn =
        localStorage.getItem("isLoggedIn");

      const userRole =
        localStorage.getItem("userRole");


      if (
        isLoggedIn === "true" &&
        userRole === "owner"
      ) {

        window.location.replace(
          "owner-dashboard.html"
        );

      }

    });


    /* =================================
       SHOW / HIDE PASSWORD
    ================================= */

    const passwordInput =
      document.getElementById("password");


    const showPassword =
      document.getElementById("showPassword");


    showPassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        showPassword.textContent = "🙈";

      } else {

        passwordInput.type = "password";
        showPassword.textContent = "👁";

      }

    });


    /* =================================
       LOGIN
    ================================= */

    const loginForm =
      document.getElementById("loginForm");


    const loginBtn =
      document.getElementById("loginBtn");


    const message =
      document.getElementById("message");


    loginForm.addEventListener(
      "submit",
      async function (e) {

        e.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Checking...";


        message.style.display =
          "none";


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

          });


        /* =============================
           LOGIN ERROR
        ============================= */

        if (error) {

          message.style.display =
            "block";

          message.style.background =
            "#fff0f0";

          message.style.color =
            "#c62828";


          message.textContent =
            "❌ Invalid email or password.";


          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "Login to Dashboard";


          return;

        }


        /* =============================
           SUCCESSFUL OWNER LOGIN
        ============================= */


        localStorage.setItem(
          "isLoggedIn",
          "true"
        );


        localStorage.setItem(
          "userRole",
          "owner"
        );


        localStorage.setItem(
          "ownerEmail",
          email
        );


        message.style.display =
          "block";


        message.style.background =
          "#ecfdf3";


        message.style.color =
          "#087443";


        message.textContent =
          "✅ Login successful. Opening dashboard...";


        setTimeout(function () {

          window.location.replace(
            "owner-dashboard.html"
          );

        }, 700);

      }

    );

  </script>

</body>
</html>
