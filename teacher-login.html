<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login | Kumaun Institute of Computer Education</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#172554,#2563eb);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo-area{
    text-align:center;
    margin-bottom:25px;
}

.logo-area img{
    width:75px;
    height:75px;
    object-fit:contain;
    border-radius:50%;
    background:#f8fafc;
    padding:5px;
    border:2px solid #e2e8f0;
    margin-bottom:10px;
}

.logo-area h2{
    color:#172554;
    font-size:22px;
    margin-bottom:6px;
}

.logo-area p{
    color:#64748b;
    font-size:13px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:bold;
    color:#334155;
}

.form-group input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    outline:none;
    font-size:14px;
}

.form-group input:focus{
    border-color:#2563eb;
}

/* DATE DROPDOWNS */

.date-select-row{
    display:grid;
    grid-template-columns:1fr 1.5fr 1.2fr;
    gap:8px;
    width:100%;
}

.date-select-row select{
    width:100%;
    padding:12px 8px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    outline:none;
    background:white;
    color:#334155;
    font-size:13px;
    cursor:pointer;
}

.date-select-row select:focus{
    border-color:#2563eb;
}

.login-btn,
.back-btn,
.reset-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.login-btn{
    background:#172554;
    color:white;
}

.login-btn:hover{
    background:#1e3a8a;
}

.reset-btn{
    background:#2563eb;
    color:white;
}

.reset-btn:hover{
    background:#1d4ed8;
}

.back-btn{
    background:#e2e8f0;
    color:#172554;
    margin-top:12px;
}

.back-btn:hover{
    background:#cbd5e1;
}

.forgot-password{
    text-align:center;
    margin-top:12px;
}

.forgot-password button{
    border:none;
    background:none;
    color:#2563eb;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.forgot-password button:hover{
    text-decoration:underline;
}

.status{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:8px;
    font-size:13px;
    line-height:1.5;
}

.status.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.status.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.status.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
}

.forgot-box{
    display:none;
}

.login-section{
    display:block;
}

.forgot-box h3{
    color:#172554;
    margin-bottom:8px;
}

.small-text{
    color:#64748b;
    font-size:13px;
    margin-bottom:20px;
    line-height:1.5;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:500px){

    body{
        padding:15px;
    }

    .login-box{
        padding:22px;
    }

    .date-select-row{
        grid-template-columns:1fr 1.35fr 1.15fr;
        gap:6px;
    }

    .date-select-row select{
        font-size:12px;
        padding:12px 5px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo-area">

        <img
            src="kumaun institute logo.png"
            alt="Kumaun Institute Logo"
        >

        <h2>👨‍🏫 Teacher Login</h2>

        <p>
            Kumaun Institute of Computer Education
        </p>

    </div>


    <!-- LOGIN SECTION -->

    <div
        class="login-section"
        id="loginSection"
    >

        <form id="loginForm">

            <div class="form-group">

                <label>
                    📧 Teacher Email

                    type="email"
                    id="loginEmail"

                    autocomplete="email"

                >

            </div>


            <div class="form-group">

                <label>
                    🔒 Password
                </label>

                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                🔐 Login Dashboard
            </button>


            <button
                type="button"
                class="back-btn"
                onclick="location.href='index.html'"

            </button>

                <button
                    type="button"
                    onclick="showForgotPassword()"

        </form>

    </div>


    <!-- FORGOT PASSWORD SECTION -->

    <div
        class="forgot-box"
        id="forgotBox"
    >

        <h3>
            🔑 Forgot Password
        </h3>

        <div class="form-group">

            <label>
                📧 Teacher Email
            </label>

            <input
                type="email"
                id="resetEmail"
                placeholder="Enter teacher email"
                autocomplete="email"
            >

        </div>


        <!-- DATE OF BIRTH -->

        <div class="form-group">

            <label>
                🎂 Date of Birth
            </label>

            <div class="date-select-row">

                <select id="resetDobDay">
                    <option value="">Day</option>
                </select>

                <select id="resetDobMonth">
                    <option value="">Month</option>
                </select>

                <select id="resetDobYear">
                    <option value="">Year</option>
                </select>

            </div>

        </div>


        <!-- JOINING DATE -->

        <div class="form-group">

            <label>
                📅 Joining Date
            </label>

            <div class="date-select-row">

                <select id="resetJoiningDay">
                    <option value="">Day</option>
                </select>

                <select id="resetJoiningMonth">
                    <option value="">Month</option>
                </select>

                <select id="resetJoiningYear">
                    <option value="">Year</option>
                </select>

            </div>

        </div>


        <div class="form-group">

            <label>
                🔒 New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
            >

        </div>


        <div class="form-group">

            <label>
                🔒 Confirm New Password
            </label>

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm new password"
                minlength="6"
            >

        </div>


        <button
            type="button"
            class="reset-btn"
            id="resetButton"
            onclick="resetTeacherPassword()"
        >
            ✅ Set New Password
        </button>


        <button
            type="button"
            class="back-btn"
            onclick="showLogin()"
        >
            ← Back to Login
        </button>


        <div
            id="resetStatus"
            class="status"
        ></div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://sfgnwdljakmtuyoxmltr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true,
                storage:window.localStorage
            }
        }
    );


/* =========================================
   TEACHER STORAGE KEYS
========================================= */

const TEACHER_PORTAL_KEY =
    "loggedInPortal";

const TEACHER_LOGGED_KEY =
    "teacherLoggedIn";

const TEACHER_USER_ID_KEY =
    "teacherAuthUserId";

const TEACHER_EMAIL_KEY =
    "teacherEmail";


/* =========================================
   SAVE TEACHER LOGIN
========================================= */

function saveTeacherLogin(user){

    try{

        localStorage.setItem(
            TEACHER_PORTAL_KEY,
            "teacher"
        );

        localStorage.setItem(
            TEACHER_LOGGED_KEY,
            "true"
        );

        localStorage.setItem(
            TEACHER_USER_ID_KEY,
            String(
                user.id || ""
            )
        );

        localStorage.setItem(
            TEACHER_EMAIL_KEY,
            String(
                user.email || ""
            )
            .trim()
            .toLowerCase()
        );

    }
    catch(error){

        console.warn(
            "Teacher login storage error:",
            error
        );

    }

}


/* =========================================
   CLEAR TEACHER LOCAL LOGIN
========================================= */

function clearTeacherLogin(){

    try{

        localStorage.removeItem(
            TEACHER_PORTAL_KEY
        );

        localStorage.removeItem(
            TEACHER_LOGGED_KEY
        );

        localStorage.removeItem(
            TEACHER_USER_ID_KEY
        );

        localStorage.removeItem(
            TEACHER_EMAIL_KEY
        );

    }
    catch(error){

        console.warn(
            "Teacher local clear error:",
            error
        );

    }

}


/* =========================================
   CHECK EXISTING SUPABASE SESSION
========================================= */

async function checkExistingTeacherSession(){

    try{

        const result =
            await supabaseClient.auth.getSession();


        if(result.error){

            console.warn(
                "Existing session error:",
                result.error
            );

            return;

        }


        const session =
            result.data &&
            result.data.session;


        if(
            session &&
            session.user
        ){

            const portal =
                localStorage.getItem(
                    TEACHER_PORTAL_KEY
                );


            const loggedIn =
                localStorage.getItem(
                    TEACHER_LOGGED_KEY
                );


            if(
                portal === "teacher" &&
                loggedIn === "true"
            ){

                saveTeacherLogin(
                    session.user
                );


                window.location.replace(
                    "teachers-dashboard.html"
                );

                return;

            }


            if(session.user.email){

                saveTeacherLogin(
                    session.user
                );


                window.location.replace(
                    "teachers-dashboard.html"
                );

                return;

            }

        }

    }
    catch(error){

        console.error(
            "Existing teacher session check error:",
            error
        );

    }

}


/* =========================================
   SHOW STATUS
========================================= */

function showStatus(
    elementId,
    message,
    type
){

    const element =
        document.getElementById(
            elementId
        );


    if(!element){
        return;
    }


    element.textContent =
        message;


    element.className =
        "status " + type;

}


/* =========================================
   HIDE STATUS
========================================= */

function hideStatus(
    elementId
){

    const element =
        document.getElementById(
            elementId
        );


    if(!element){
        return;
    }


    element.textContent =
        "";


    element.className =
        "status";

}


/* =========================================
   SHOW FORGOT PASSWORD
========================================= */

function showForgotPassword(){

    hideStatus(
        "loginStatus"
    );

    hideStatus(
        "resetStatus"
    );


    document
        .getElementById(
            "loginSection"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "forgotBox"
        )
        .style.display =
        "block";

}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

    hideStatus(
        "loginStatus"
    );

    hideStatus(
        "resetStatus"
    );


    document
        .getElementById(
            "forgotBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "loginSection"
        )
        .style.display =
        "block";

}


/* =========================================
   DATE DROPDOWN DATA
========================================= */

const monthNames = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];


/* =========================================
   CREATE DAY OPTIONS
========================================= */

function populateDays(selectId){

    const select =
        document.getElementById(
            selectId
        );

    if(!select){
        return;
    }

    for(let day = 1; day <= 31; day++){

        const option =
            document.createElement(
                "option"
            );

        option.value =
            String(day).padStart(2,"0");

        option.textContent =
            String(day).padStart(2,"0");

        select.appendChild(
            option
        );

    }

}


/* =========================================
   CREATE MONTH OPTIONS
========================================= */

function populateMonths(selectId){

    const select =
        document.getElementById(
            selectId
        );

    if(!select){
        return;
    }

    monthNames.forEach(
        function(month,index){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                String(index + 1).padStart(2,"0");

            option.textContent =
                month;

            select.appendChild(
                option
            );

        }
    );

}


/* =========================================
   CREATE YEAR OPTIONS
========================================= */

function populateYears(
    selectId,
    startYear,
    endYear
){

    const select =
        document.getElementById(
            selectId
        );

    if(!select){
        return;
    }


    for(
        let year = endYear;
        year >= startYear;
        year--
    ){

        const option =
            document.createElement(
                "option"
            );

        option.value =
            String(year);

        option.textContent =
            String(year);

        select.appendChild(
            option
        );

    }

}


/* =========================================
   CHECK REAL DATE
========================================= */

function isValidDate(
    year,
    month,
    day
){

    const date =
        new Date(
            Number(year),
            Number(month) - 1,
            Number(day)
        );


    return(
        date.getFullYear() === Number(year) &&
        date.getMonth() === Number(month) - 1 &&
        date.getDate() === Number(day)
    );

}


/* =========================================
   GET DATE FROM DROPDOWNS
========================================= */

function getDateFromDropdowns(
    dayId,
    monthId,
    yearId
){

    const day =
        document.getElementById(
            dayId
        ).value;

    const month =
        document.getElementById(
            monthId
        ).value;

    const year =
        document.getElementById(
            yearId
        ).value;


    if(
        !day ||
        !month ||
        !year
    ){

        return{
            valid:false,
            value:""
        };

    }


    if(
        !isValidDate(
            year,
            month,
            day
        )
    ){

        return{
            valid:false,
            value:""
        };

    }


    const dateString =
        year +
        "-" +
        month +
        "-" +
        day;


    return{
        valid:true,
        value:dateString
    };

}


/* =========================================
   DATE DROPDOWN FUTURE DATE CONTROL
========================================= */

function setupDateValidation(){

    const today =
        new Date();


    today.setHours(
        23,
        59,
        59,
        999
    );


    const datePairs = [

        {
            day:"resetDobDay",
            month:"resetDobMonth",
            year:"resetDobYear"
        },

        {
            day:"resetJoiningDay",
            month:"resetJoiningMonth",
            year:"resetJoiningYear"
        }

    ];


    datePairs.forEach(
        function(pair){

            const daySelect =
                document.getElementById(
                    pair.day
                );

            const monthSelect =
                document.getElementById(
                    pair.month
                );

            const yearSelect =
                document.getElementById(
                    pair.year
                );


            function validateDate(){

                if(
                    !daySelect.value ||
                    !monthSelect.value ||
                    !yearSelect.value
                ){

                    return;

                }


                const selected =
                    new Date(
                        Number(yearSelect.value),
                        Number(monthSelect.value) - 1,
                        Number(daySelect.value)
                    );


                if(
                    selected > today ||
                    !isValidDate(
                        yearSelect.value,
                        monthSelect.value,
                        daySelect.value
                    )
                ){

                    daySelect.value = "";
                    monthSelect.value = "";
                    yearSelect.value = "";

                    showStatus(
                        "resetStatus",
                        "❌ Please select a valid date. Future dates are not allowed.",
                        "error"
                    );

                }

            }


            daySelect.addEventListener(
                "change",
                validateDate
            );

            monthSelect.addEventListener(
                "change",
                validateDate
            );

            yearSelect.addEventListener(
                "change",
                validateDate
            );

        }
    );

}


/* =========================================
   INITIALIZE DATE DROPDOWNS
========================================= */

function initializeDateDropdowns(){

    const currentYear =
        new Date().getFullYear();


    /*
      DOB:
      1950 se current year tak.
    */

    populateDays(
        "resetDobDay"
    );

    populateMonths(
        "resetDobMonth"
    );

    populateYears(
        "resetDobYear",
        1950,
        currentYear
    );


    /*
      Joining Date:
      2000 se current year tak.
    */

    populateDays(
        "resetJoiningDay"
    );

    populateMonths(
        "resetJoiningMonth"
    );

    populateYears(
        "resetJoiningYear",
        2000,
        currentYear
    );


    setupDateValidation();

}


/* =========================================
   TEACHER LOGIN
========================================= */

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            hideStatus(
                "loginStatus"
            );


            const email =
                document
                    .getElementById(
                        "loginEmail"
                    )
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById(
                        "loginPassword"
                    )
                    .value;


            const loginButton =
                document
                    .getElementById(
                        "loginButton"
                    );


            if(!email){

                showStatus(
                    "loginStatus",
                    "❌ Please enter your teacher email.",
                    "error"
                );

                return;

            }


            if(!password){

                showStatus(
                    "loginStatus",
                    "❌ Please enter your password.",
                    "error"
                );

                return;

            }


            loginButton.disabled =
                true;


            loginButton.textContent =
                "Logging in...";


            try{

                showStatus(
                    "loginStatus",
                    "Login verify ho raha hai...",
                    "info"
                );


                const result =
                    await supabaseClient.auth.signInWithPassword({

                        email:email,

                        password:password

                    });


                const data =
                    result.data;

                const error =
                    result.error;


                if(error){

                    console.error(
                        "Supabase login error:",
                        error
                    );

                    throw error;

                }


                if(
                    !data ||
                    !data.session ||
                    !data.user
                ){

                    throw new Error(
                        "Login session was not created."
                    );

                }


                saveTeacherLogin(
                    data.user
                );


                showStatus(
                    "loginStatus",
                    "✅ Login successful! Dashboard Opening...",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.replace(
                            "teachers-dashboard.html"
                        );

                    },
                    500
                );


            }
            catch(error){

                console.error(
                    "Teacher login error:",
                    error
                );


                clearTeacherLogin();


                showStatus(
                    "loginStatus",
                    "❌ Email or password is incorrect.",
                    "error"
                );


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "🔐 Login Dashboard";

            }

        }
    );


/* =========================================
   RESET TEACHER PASSWORD
========================================= */

async function resetTeacherPassword(){

    hideStatus(
        "resetStatus"
    );


    const email =
        document
            .getElementById(
                "resetEmail"
            )
            .value
            .trim()
            .toLowerCase();


    const dobResult =
        getDateFromDropdowns(
            "resetDobDay",
            "resetDobMonth",
            "resetDobYear"
        );


    const joiningResult =
        getDateFromDropdowns(
            "resetJoiningDay",
            "resetJoiningMonth",
            "resetJoiningYear"
        );


    const newPassword =
        document
            .getElementById(
                "newPassword"
            )
            .value;


    const confirmNewPassword =
        document
            .getElementById(
                "confirmNewPassword"
            )
            .value;


    const resetButton =
        document
            .getElementById(
                "resetButton"
            );


    if(
        !email ||
        !dobResult.valid ||
        !joiningResult.valid ||
        !newPassword ||
        !confirmNewPassword
    ){

        showStatus(
            "resetStatus",
            "❌ Please fill in all details correctly.",
            "error"
        );

        return;

    }


    const today =
        new Date();


    today.setHours(
        23,
        59,
        59,
        999
    );


    const dobDate =
        new Date(
            dobResult.value +
            "T00:00:00"
        );


    const joiningDateObj =
        new Date(
            joiningResult.value +
            "T00:00:00"
        );


    if(
        dobDate > today ||
        joiningDateObj > today
    ){

        showStatus(
            "resetStatus",
            "❌ Future date is not allowed.",
            "error"
        );

        return;

    }


    if(
        newPassword.length < 6
    ){

        showStatus(
            "resetStatus",
            "❌ Password must be at least 6 characters long.",
            "error"
        );

        return;

    }


    if(
        newPassword !==
        confirmNewPassword
    ){

        showStatus(
            "resetStatus",
            "❌ New Password and Confirm New Password do not match.",
            "error"
        );

        return;

    }


    resetButton.disabled =
        true;


    resetButton.textContent =
        "Verifying...";


    try{

        /*
          VERIFY TEACHER DETAILS
        */

        const result =
            await supabaseClient
                .from("teachers")
                .select(
                    "id,name,email,dob,joining_date"
                )
                .eq(
                    "email",
                    email
                )
                .eq(
                    "dob",
                    dobResult.value
                )
                .eq(
                    "joining_date",
                    joiningResult.value
                )
                .maybeSingle();


        const teacher =
            result.data;

        const teacherError =
            result.error;


        if(teacherError){

            throw teacherError;

        }


        if(!teacher){

            showStatus(
                "resetStatus",
                "❌ Teacher Email, DOB or Joining Date do not match.",
                "error"
            );

            return;

        }


        showStatus(
            "resetStatus",
            "✅ Teacher verified. Updating password...",
            "info"
        );


        /*
          PASSWORD RESET FUNCTION
        */

        const resetResult =
            await supabaseClient
                .functions
                .invoke(
                    "reset-teacher-password",
                    {
                        body:{
                            email:email,
                            newPassword:newPassword
                        }
                    }
                );


        const data =
            resetResult.data;

        const resetError =
            resetResult.error;


        if(resetError){

            throw resetError;

        }


        if(
            data &&
            data.error
        ){

            throw new Error(
                data.error
            );

        }


        showStatus(
            "resetStatus",
            "✅ Password successfully changed! Please login with your new password.",
            "success"
        );


        document
            .getElementById(
                "resetEmail"
            )
            .value =
            "";


        document
            .getElementById(
                "resetDobDay"
            )
            .value =
            "";

        document
            .getElementById(
                "resetDobMonth"
            )
            .value =
            "";

        document
            .getElementById(
                "resetDobYear"
            )
            .value =
            "";


        document
            .getElementById(
                "resetJoiningDay"
            )
            .value =
            "";

        document
            .getElementById(
                "resetJoiningMonth"
            )
            .value =
            "";

        document
            .getElementById(
                "resetJoiningYear"
            )
            .value =
            "";


        document
            .getElementById(
                "newPassword"
            )
            .value =
            "";


        document
            .getElementById(
                "confirmNewPassword"
            )
            .value =
            "";


        setTimeout(
            function(){

                showLogin();

            },
            2000
        );

    }
    catch(error){

        console.error(
            "Password reset error:",
            error
        );


        showStatus(
            "resetStatus",
            "❌ Password change failed. Please try again.",
            "error"
        );

    }
    finally{

        resetButton.disabled =
            false;


        resetButton.textContent =
            "✅ Set New Password";

    }

}


/* =========================================
   AUTH STATE LISTENER
========================================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "Teacher Auth Event:",
            event
        );


        if(
            event === "SIGNED_IN" &&
            session &&
            session.user
        ){

            saveTeacherLogin(
                session.user
            );

            return;

        }


        if(
            event === "TOKEN_REFRESHED" &&
            session &&
            session.user
        ){

            saveTeacherLogin(
                session.user
            );

            return;

        }


        if(
            event === "SIGNED_OUT"
        ){

            clearTeacherLogin();

        }

    }
);


/* =========================================
   PAGE LOAD
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initializeDateDropdowns();

        checkExistingTeacherSession();

    }
);

</script>
