<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notices | Kumaun Institute</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172554;
}

/* HEADER */

.header{
    background:#12327f;
    color:white;
    padding:14px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:52px;
    height:52px;
    background:white;
    border-radius:10px;
    padding:4px;
    object-fit:contain;
}

.header h2{
    font-size:20px;
}

.header p{
    margin-top:4px;
    font-size:12px;
    color:#dbeafe;
}

.back-btn{
    border:0;
    background:white;
    color:#12327f;
    padding:10px 16px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}

.page-title{
    margin-bottom:20px;
}

.page-title h1{
    font-size:28px;
}

.page-title p{
    margin-top:6px;
    color:#64748b;
}

/* NOTICE */

.notices-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.notice-card{
    background:white;
    border-radius:16px;
    padding:14px 16px;
    box-shadow:0 4px 15px rgba(15,35,80,.07);
    border-left:5px solid #12327f;
}

.notice-top{
    display:flex;
    align-items:center;
    gap:10px;
}

.notice-icon{
    width:42px;
    height:42px;
    background:#e8f0ff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.notice-title{
    flex:1;
    font-size:16px;
    font-weight:800;
    color:#12327f;
    line-height:1.3;
}

.notice-content{
    margin-top:10px;
    color:#475569;
    line-height:1.5;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
}

/* SENDER */

.notice-sender{
    margin-top:10px;
    padding:8px 11px;
    background:#f0f7ff;
    border:1px solid #dbeafe;
    border-radius:9px;
    color:#1e40af;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
}

.notice-sender-name{
    color:#172554;
    font-weight:800;
    word-break:break-word;
}

.notice-date{
    display:inline-flex;
    align-items:center;
    margin-top:10px;
    padding:5px 10px;
    background:#e0f2fe;
    color:#0369a1;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

/* DOCUMENT BUTTONS */

.notice-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

.view-btn,
.download-btn{
    border:0;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    font-size:12px;
}

.view-btn{
    background:#12327f;
    color:white;
}

.download-btn{
    background:#e8f0ff;
    color:#12327f;
}

/* STATES */

.loading,
.empty,
.error{
    grid-column:1/-1;
    background:white;
    padding:35px 20px;
    text-align:center;
    border-radius:16px;
    color:#64748b;
}

.error{
    color:#b91c1c;
}

/* MOBILE */

@media(max-width:700px){

    .header{
        padding:12px 14px;
    }

    .logo{
        width:45px;
        height:45px;
    }

    .header h2{
        font-size:15px;
    }

    .header p{
        font-size:10px;
    }

    .back-btn{
        padding:9px 11px;
        font-size:12px;
    }

    .container{
        width:93%;
        margin:18px auto;
    }

    .page-title h1{
        font-size:23px;
    }

    .page-title p{
        font-size:13px;
    }

    .notices-grid{
        grid-template-columns:1fr;
        gap:11px;
    }

    .notice-card{
        padding:13px 14px;
        border-radius:14px;
    }

    .notice-title{
        font-size:15px;
    }

    .notice-icon{
        width:38px;
        height:38px;
        font-size:19px;
    }

    .notice-content{
        font-size:12px;
        margin-top:8px;
    }

    .notice-sender{
        font-size:11px;
        margin-top:8px;
    }

    .notice-date{
        margin-top:8px;
        font-size:10px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="header-left">

        <img
            class="logo"
            src="https://sfgnwdljakmtuyoxmltr.supabase.co/storage/v1/object/public/institute-assets/kumaun%20institute%20logo.png"
            alt="Institute Logo"
        >

        <div>

            <h2>
                Kumaun Institute of Computer Education
            </h2>

            <p>
                Owner Portal
            </p>

        </div>

    </div>

    <button
        class="back-btn"
        onclick="window.location.href='owner-dashboard.html'"
    >
        ← Back
    </button>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            📢 Institute Notices
        </h1>

        <p>
            Institute Latest Notices & Announcements.
        </p>

    </div>


    <div
        id="noticesContainer"
        class="notices-grid"
    >

        <div class="loading">
            Notices loading...
        </div>

    </div>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://sfgnwdljakmtuyoxmltr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   FORMAT DATE + TIME
========================================= */

function formatDateTime(value){

    if(!value){
        return "";
    }

    const date =
    new Date(value);

    if(isNaN(date.getTime())){
        return value;
    }

    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   GET NOTICE FILE
========================================= */

function getNoticeFile(notice){

    return (

        notice.file_url ||
        notice.document_url ||
        notice.pdf_url ||
        notice.attachment_url ||
        ""

    );

}


/* =========================================
   GET SENDER NAME
========================================= */

function getSenderName(notice){

    return (
        notice.sender_name ||
        "Institute"
    );

}


/* =========================================
   LOAD NOTICES
========================================= */

async function loadNotices(){

    const container =
    document.getElementById(
        "noticesContainer"
    );


    container.innerHTML = `
        <div class="loading">
            Notices loading...
        </div>
    `;


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("notices")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){
            throw error;
        }


        if(!data || !data.length){

            container.innerHTML = `
                <div class="empty">

                    📭<br><br>

                    No notices available.

                </div>
            `;

            return;

        }


        container.innerHTML = "";


        data.forEach(
        function(notice){

            const fileUrl =
            getNoticeFile(
                notice
            );


            const title =
            notice.title ||
            notice.notice_title ||
            "Institute Notice";


            const content =
            notice.content ||
            notice.description ||
            notice.message ||
            "";


            const senderName =
            getSenderName(
                notice
            );


            const dateTime =
            formatDateTime(
                notice.created_at ||
                notice.notice_date
            );


            let actions = "";


            if(fileUrl){

                actions = `
                    <div class="notice-actions">

                        <a
                            href="${escapeHTML(fileUrl)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="view-btn"
                        >
                            👁 View Document
                        </a>

                        <a
                            href="${escapeHTML(fileUrl)}"
                            download
                            class="download-btn"
                        >
                            📥 Download
                        </a>

                    </div>
                `;

            }


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "notice-card";


            card.innerHTML = `

                <div class="notice-top">

                    <div class="notice-icon">
                        📢
                    </div>

                    <div class="notice-title">
                        ${escapeHTML(title)}
                    </div>

                </div>


                ${
                    content
                    ?
                    `
                    <div class="notice-content">
                        ${escapeHTML(content)}
                    </div>
                    `
                    :
                    ""
                }


                <div class="notice-sender">

                    👤

                    <span>
                        Sent by:
                    </span>

                    <span class="notice-sender-name">
                        ${escapeHTML(senderName)}
                    </span>

                </div>


                ${
                    dateTime
                    ?
                    `
                    <div class="notice-date">
                        🕒 ${escapeHTML(dateTime)}
                    </div>
                    `
                    :
                    ""
                }


                ${actions}

            `;


            container.appendChild(
                card
            );

        });

    }
    catch(error){

        console.error(error);


        container.innerHTML = `
            <div class="error">

                ❌ Notices load failed.

                <br><br>

                ${escapeHTML(error.message)}

            </div>
        `;

    }

}


/* =========================================
   START
========================================= */

loadNotices();

</script>

</body>

</html>
