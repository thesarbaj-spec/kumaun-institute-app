<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Student Login | Kumaun Institute of Computer Education
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#172033;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:18px;
    padding:30px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.logo{
    width:90px;
    height:90px;
    margin:0 auto 15px;
    border-radius:50%;
    overflow:hidden;
    background:#172554;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    text-align:center;
    font-size:18px;
    line-height:1.3;
    color:#172554;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:13px;
    margin-top:7px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#475569;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#2563eb;
}

.login-btn{
    width:100%;
    border:0;
    background:#172554;
    color:white;
    padding:13px;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#1e3a8a;
}

.login-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.forgot-btn{
    width:100%;
    border:0;
    background:none;
    color:#2563eb;
    padding:12px 0 0;
    font-size:13px;
    cursor:pointer;
}

.forgot-btn:hover{
    text-decoration:underline;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
    line-height:1.4;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.reset-box{
    display:none;
}

.back-btn{
    width:100%;
    border:0;
    background:#e2e8f0;
    color:#334155;
    padding:13px;
    border-radius:9px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.footer{
    text-align:center;
    color:#94a3b8;
    font-size:11px;
    margin-top:20px;
}

.small-note{
    text-align:center;
    color:#64748b;
    font-size:12px;
    line-height:1.5;
    margin-bottom:20px;
}

.loading-screen{
    display:none;
    position:fixed;
    inset:0;
    background:#f4f6f9;
    z-index:9999;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    color:#172554;
}

.loading-screen.show{
    display:flex;
}

.loader{
    width:38px;
    height:38px;
    border:4px solid #cbd5e1;
    border-top-color:#172554;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

</style>

</head>

<body>


<!-- AUTO LOGIN LOADING SCREEN -->

<div
id="loadingScreen"
class="loading-screen"
>

    <div class="loader"></div>

    <strong>
        Checking login...
    </strong>

</div>



<!-- LOGIN BOX -->

<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <img
        src="kumaun institute logo.png"
        alt="Kumaun Institute"
        >

    </div>


    <!-- TITLE -->

    <h1>
        Kumaun Institute of Computer Education
    </h1>


    <p class="subtitle">
        Student Portal
    </p>



    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <div id="loginSection">


        <div
        id="loginMessage"
        class="message"
        ></div>



        <form id="loginForm">


            <!-- MOBILE -->

            <div class="form-group">

                <label>
                    📱 Mobile Number
                </label>

                <input
                type="tel"
                id="mobile"
                placeholder="Enter registered mobile number"
                maxlength="10"
                inputmode="numeric"
                autocomplete="username"
                required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    🔐 Password
                </label>

                <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                >

            </div>



            <!-- LOGIN BUTTON -->

            <button
            type="submit"
            id="loginBtn"
            class="login-btn"
            >

                Login

            </button>


        </form>



        <!-- FORGOT PASSWORD -->

        <button
        type="button"
        id="forgotBtn"
        class="forgot-btn"
        >

            Forgot Password?

        </button>


    </div>



    <!-- =========================
         PASSWORD RESET SECTION
    ========================== -->

    <div
    id="resetSection"
    class="reset-box"
    >


        <div
        id="resetMessage"
        class="message"
        ></div>



        <p class="small-note">

            Password reset karne ke liye
            apna registered mobile number,
            Date of Birth aur institute joining date
            enter karein.

        </p>



        <form id="resetForm">


            <!-- MOBILE -->

            <div class="form-group">

                <label>
                    📱 Mobile Number
                </label>

                <input
                type="tel"
                id="resetMobile"
                placeholder="Enter registered mobile number"
                maxlength="10"
                inputmode="numeric"
                required
                >

            </div>



            <!-- DOB -->

            <div class="form-group">

                <label>
                    🎂 Date of Birth
                </label>

                <input
                type="date"
                id="dob"
                required
                >

            </div>



            <!-- JOINING DATE -->

            <div class="form-group">

                <label>
                    📅 Institute Joining Date
                </label>

                <input
                type="date"
                id="joiningDate"
                required
                >

            </div>



            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label>
                    🔐 New Password
                </label>

                <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
                >

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    🔐 Confirm New Password
                </label>

                <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password"
                minlength="6"
                required
                >

            </div>



            <!-- RESET BUTTON -->

            <button
            type="submit"
            id="resetBtn"
            class="login-btn"
            >

                Reset Password

            </button>


        </form>



        <!-- BACK -->

        <button
        type="button"
        id="backBtn"
        class="back-btn"
        >

            ← Back to Login

        </button>


    </div>



    <!-- FOOTER -->

    <div class="footer">

        © Kumaun Institute of Computer Education
        • Student Portal

    </div>


</div>



<script>


/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
    "https://sfgnwdljakmtuyoxmltr.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wpPLMb__G9WtazYtQ8FiuA_F8CtBXTO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );



/* =========================================
   ELEMENTS
========================================= */

const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );


const loginSection =
    document.getElementById(
        "loginSection"
    );


const resetSection =
    document.getElementById(
        "resetSection"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const mobileInput =
    document.getElementById(
        "mobile"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const forgotBtn =
    document.getElementById(
        "forgotBtn"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const resetForm =
    document.getElementById(
        "resetForm"
    );


const resetMobile =
    document.getElementById(
        "resetMobile"
    );


const dob =
    document.getElementById(
        "dob"
    );


const joiningDate =
    document.getElementById(
        "joiningDate"
    );


const newPassword =
    document.getElementById(
        "newPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const resetBtn =
    document.getElementById(
        "resetBtn"
    );


const resetMessage =
    document.getElementById(
        "resetMessage"
    );


const backBtn =
    document.getElementById(
        "backBtn"
    );



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "message " + type;

    element.style.display =
        "block";

}



/* =========================================
   HIDE MESSAGE
========================================= */

function hideMessage(
    element
){

    element.style.display =
        "none";

}



/* =========================================
   SHOW LOADING
========================================= */

function showLoading(){

    loadingScreen.classList.add(
        "show"
    );

}



/* =========================================
   HIDE LOADING
========================================= */

function hideLoading(){

    loadingScreen.classList.remove(
        "show"
    );

}



/* =========================================
   CLEAR STUDENT LOCAL DATA
========================================= */

function clearStudentLocalData(){

    localStorage.removeItem(
        "studentId"
    );

    localStorage.removeItem(
        "student_id"
    );

    localStorage.removeItem(
        "loggedInStudentId"
    );

    localStorage.removeItem(
        "studentAuthUserId"
    );

    localStorage.removeItem(
        "studentLoggedIn"
    );

}



/* =========================================
   SAVE STUDENT LOGIN DATA
========================================= */

function saveStudentLoginData(
    studentId,
    authUserId
){

    localStorage.setItem(
        "studentId",
        String(studentId)
    );

    localStorage.setItem(
        "student_id",
        String(studentId)
    );

    localStorage.setItem(
        "loggedInStudentId",
        String(studentId)
    );

    localStorage.setItem(
        "studentAuthUserId",
        String(authUserId)
    );

    localStorage.setItem(
        "studentLoggedIn",
        "true"
    );

}



/* =========================================
   AUTO LOGIN CHECK
========================================= */

async function checkExistingLogin(){

    showLoading();

    try{

        const {
            data,
            error
        } =
            await supabaseClient
            .auth
            .getSession();


        if(error){

            console.error(
                "Session check error:",
                error
            );

            clearStudentLocalData();

            hideLoading();

            return;

        }


        const session =
            data ?
            data.session :
            null;


        if(
            !session ||
            !session.user
        ){

            clearStudentLocalData();

            hideLoading();

            return;

        }


        const authUserId =
            session.user.id;


        const {
            data:studentData,
            error:studentError
        } =
            await supabaseClient
            .from("Students")
            .select("id, auth_user_id")
            .eq(
                "auth_user_id",
                authUserId
            )
            .maybeSingle();


        if(studentError){

            console.error(
                "Student profile check error:",
                studentError
            );

            hideLoading();

            return;

        }


        if(!studentData){

            await supabaseClient
                .auth
                .signOut();

            clearStudentLocalData();

            hideLoading();

            return;

        }


        saveStudentLoginData(
            studentData.id,
            authUserId
        );


        window.location.replace(
            "student-dashboard.html"
        );

    }

    catch(error){

        console.error(
            "Auto login error:",
            error
        );

        hideLoading();

    }

}



/* =========================================
   FORGOT PASSWORD
========================================= */

forgotBtn.addEventListener(
    "click",
    function(){

        hideMessage(
            loginMessage
        );

        loginSection.style.display =
            "none";

        resetSection.style.display =
            "block";

    }
);



/* =========================================
   BACK TO LOGIN
========================================= */

backBtn.addEventListener(
    "click",
    function(){

        hideMessage(
            resetMessage
        );

        resetSection.style.display =
            "none";

        loginSection.style.display =
            "block";

    }
);



/* =========================================
   STUDENT LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessage(
            loginMessage
        );


        const mobile =
            mobileInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !/^[0-9]{10}$/.test(
                mobile
            )
        ){

            showMessage(
                loginMessage,
                "Please enter a valid 10 digit mobile number.",
                "error"
            );

            return;

        }


        if(!password){

            showMessage(
                loginMessage,
                "Please enter your password.",
                "error"
            );

            return;

        }


        loginBtn.disabled =
            true;


        loginBtn.textContent =
            "Logging in...";


        try{


            /* CREATE AUTH EMAIL */

            const authEmail =
                mobile +
                "@students.kumauninstitute.local";


            /* SUPABASE LOGIN */

            const {
                data:authData,
                error:authError
            } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        authEmail,

                    password:
                        password

                });


            if(authError){

                console.error(
                    authError
                );


                showMessage(
                    loginMessage,
                    "Mobile number ya password galat hai.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Login";


                return;

            }


            if(
                !authData ||
                !authData.user
            ){

                showMessage(
                    loginMessage,
                    "Login nahi ho paya. Please try again.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Login";


                return;

            }


            const authUserId =
                authData.user.id;


            /* CHECK STUDENT PROFILE */

            const {
                data:studentData,
                error:studentError
            } =
                await supabaseClient
                .from("Students")
                .select("*")
                .eq(
                    "auth_user_id",
                    authUserId
                )
                .maybeSingle();


            if(studentError){

                console.error(
                    studentError
                );


                await supabaseClient
                    .auth
                    .signOut();


                clearStudentLocalData();


                showMessage(
                    loginMessage,
                    "Student profile nahi mili.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Login";


                return;

            }


            if(!studentData){

                await supabaseClient
                    .auth
                    .signOut();


                clearStudentLocalData();


                showMessage(
                    loginMessage,
                    "Student profile linked nahi hai.",
                    "error"
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "Login";


                return;

            }


            /* SAVE LOGIN DATA */

            saveStudentLoginData(
                studentData.id,
                authUserId
            );


            showMessage(
                loginMessage,
                "Login successful. Dashboard open ho raha hai...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "student-dashboard.html"
                    );

                },
                700
            );


        }
        catch(error){

            console.error(
                error
            );


            showMessage(
                loginMessage,
                "Server error. Please try again.",
                "error"
            );


            loginBtn.disabled =
                false;


            loginBtn.textContent =
                "Login";

        }

    }
);



/* =========================================
   PASSWORD RESET
========================================= */

resetForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessage(
            resetMessage
        );


        const mobile =
            resetMobile.value.trim();


        const dateOfBirth =
            dob.value;


        const admissionDate =
            joiningDate.value;


        const password =
            newPassword.value;


        const confirm =
            confirmPassword.value;



        /* MOBILE VALIDATION */

        if(
            !/^[0-9]{10}$/.test(
                mobile
            )
        ){

            showMessage(
                resetMessage,
                "Please enter a valid 10 digit mobile number.",
                "error"
            );

            return;

        }



        /* DOB VALIDATION */

        if(!dateOfBirth){

            showMessage(
                resetMessage,
                "Please select your Date of Birth.",
                "error"
            );

            return;

        }



        /* JOINING DATE VALIDATION */

        if(!admissionDate){

            showMessage(
                resetMessage,
                "Please select your institute joining date.",
                "error"
            );

            return;

        }



        /* PASSWORD VALIDATION */

        if(
            password.length < 6
        ){

            showMessage(
                resetMessage,
                "New password kam se kam 6 characters ka hona chahiye.",
                "error"
            );

            return;

        }



        /* CONFIRM PASSWORD */

        if(
            password !== confirm
        ){

            showMessage(
                resetMessage,
                "New password aur confirm password same nahi hain.",
                "error"
            );

            return;

        }


        resetBtn.disabled =
            true;


        resetBtn.textContent =
            "Verifying...";


        try{


            /* CALL EDGE FUNCTION */

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/functions/v1/create-student-account",

                    {

                        method:
                            "POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "apikey":
                                SUPABASE_KEY

                        },

                        body:
                            JSON.stringify({

                                action:
                                    "reset",

                                mobile:
                                    mobile,

                                dob:
                                    dateOfBirth,

                                admission_date:
                                    admissionDate,

                                new_password:
                                    password

                            })

                    }

                );


            let result =
                null;


            try{

                result =
                    await response.json();

            }
            catch(jsonError){

                throw new Error(
                    "Server response invalid hai."
                );

            }


            if(
                !response.ok ||
                !result.success
            ){

                showMessage(
                    resetMessage,
                    result.message ||
                    "Student details match nahi hui.",
                    "error"
                );


                resetBtn.disabled =
                    false;


                resetBtn.textContent =
                    "Reset Password";


                return;

            }


            showMessage(
                resetMessage,
                "✅ Password successfully reset ho gaya. Ab naye password se login karein.",
                "success"
            );


            resetForm.reset();


            setTimeout(
                function(){

                    resetSection.style.display =
                        "none";


                    loginSection.style.display =
                        "block";


                    hideMessage(
                        resetMessage
                    );


                    resetBtn.disabled =
                        false;


                    resetBtn.textContent =
                        "Reset Password";

                },
                2000
            );


        }
        catch(error){

            console.error(
                error
            );


            showMessage(
                resetMessage,
                "Server error. Please try again.",
                "error"
            );


            resetBtn.disabled =
                false;


            resetBtn.textContent =
                "Reset Password";

        }

    }
);



/* =========================================
   AUTH STATE LISTENER
========================================= */

supabaseClient
.auth
.onAuthStateChange(
    function(
        event,
        session
    ){

        if(
            event === "SIGNED_OUT"
        ){

            clearStudentLocalData();

        }

    }
);



/* =========================================
   START AUTO LOGIN CHECK
========================================= */

checkExistingLogin();


</script>

</body>
</html>
